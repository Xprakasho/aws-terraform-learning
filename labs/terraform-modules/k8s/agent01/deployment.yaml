apiVersion: apps/v1
kind: Deployment

metadata:
  name: agent01-app
  namespace: agent01

spec:
  replicas: 2

  selector:
    matchLabels:
      app: agent01

  template:
    metadata:
      labels:
        app: agent01

    spec:
      containers:
        - name: nginx
          image: nginx:latest
          ports:
            - containerPort: 80